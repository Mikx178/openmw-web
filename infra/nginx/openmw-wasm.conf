# openmw-wasm static site. EDIT server_name to your domain before deploying.
#
# The cross-origin-isolation headers here are the whole reason this can't be a plain
# static bucket: without them SharedArrayBuffer is unavailable and the engine won't boot.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.example.com;          # <-- your openmw domain

    ssl_certificate     /etc/ssl/openmw/origin.crt;
    ssl_certificate_key /etc/ssl/openmw/origin.key;

    root /var/www/openmw-wasm/play;
    index index.html;

    # Cross-origin isolation on EVERY response (required for wasm threads / SharedArrayBuffer).
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "cross-origin"  always;

    # Serve prebuilt brotli/gzip siblings (wasm-build/make_br.sh) when the client accepts them.
    gzip_static  on;
    # brotli_static on;   # uncomment if the nginx brotli module is installed

    types { application/wasm wasm; }

    # Launcher is the landing page. Because there is no server.py here, route "/" to it
    # explicitly (this is the production equivalent of OPENMW_LAUNCHER=1).
    location = / { try_files /launcher.html =404; }

    # Immutable engine artifacts: cache hard (Cloudflare honors this; browsers too).
    location ~* \.(wasm|data|js)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "cross-origin"  always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}

# Plain HTTP -> HTTPS (Cloudflare also does this, but belt-and-suspenders for direct edge hits).
server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;          # <-- your openmw domain
    return 301 https://$host$request_uri;
}
