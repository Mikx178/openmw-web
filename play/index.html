<!doctype html><html><head><meta charset="utf-8"><title>OpenMW — Morrowind</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:,"><!-- empty favicon: stop the browser's auto /favicon.ico request 404 -->
<style>
 html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
 /* Windowless: the canvas fills the entire browser viewport; its drawing buffer is driven
    from window.innerWidth/Height in JS so the render resolution always matches the window. */
 #canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;border:0;outline:none;background:#000}
 /* Debug log kept in the DOM (readable via devtools console / eval) but hidden;
    press the ` (backtick) key to toggle it. */
 #log{position:fixed;left:0;bottom:0;width:100%;max-height:40%;box-sizing:border-box;z-index:10;
      display:none;overflow:auto;margin:0;padding:6px 10px;white-space:pre-wrap;
      background:rgba(10,10,15,.85);color:#a6e3a1;font:11px/1.35 ui-monospace,Menlo,monospace}
 #log.show{display:block}
 .err{color:#f38ba8}
 /* Always-visible compact status: FPS + latest phase. Toggle full log with backtick (`). */
 #hud{position:fixed;top:0;left:0;z-index:11;padding:3px 9px;cursor:pointer;max-width:100vw;
      overflow:hidden;white-space:pre;background:rgba(10,10,15,.72);color:#89b4fa;
      font:11px/1.35 ui-monospace,Menlo,monospace;text-shadow:0 1px 2px #000;user-select:none}
 #hud:hover{background:rgba(20,20,30,.9)}
</style></head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<div id="hud">☰ starting…</div>
<div id="log">booting…</div>
<script>
 // ?wasmdbg: introspect what the glue passes to WebAssembly.instantiate (debug the env-import error)
 if (/[?&]wasmdbg\b/.test(location.search)) (function(){
   var oi = WebAssembly.instantiate.bind(WebAssembly);
   WebAssembly.instantiate = function(bufOrMod, imports){
     try {
       console.log('[wasmdbg] instantiate called; imports type:', typeof imports,
         '| keys:', imports ? Object.keys(imports).join(',') : '(none)',
         '| env type:', imports && typeof imports.env,
         '| env keys:', imports && imports.env ? Object.keys(imports.env).length : -1,
         '| memory:', imports && imports.env && String(imports.env.memory));
     } catch(e){ console.log('[wasmdbg] introspect err', e); }
     return oi(bufOrMod, imports);
   };
   var os = WebAssembly.instantiateStreaming && WebAssembly.instantiateStreaming.bind(WebAssembly);
   if (os) WebAssembly.instantiateStreaming = function(src, imports){
     try { console.log('[wasmdbg] instantiateStreaming; env type:', imports && typeof imports.env, '| env keys:', imports && imports.env ? Object.keys(imports.env).length : -1); } catch(e){}
     return os(src, imports);
   };
 })();
 // Wrap getContext (installed BEFORE openmw.js loads) to fix the WebGL2 context attributes:
 //  - alpha:false (CORRECTNESS): the default transparent canvas composites the PAGE BACKGROUND
 //    through any fragment with dst-alpha<1 (halos on particles/weather/GUI edges) and treats
 //    canvas pixels as premultiplied while OpenMW blends straight alpha (double-darkening).
 //    Desktop renders to an opaque framebuffer; so must we.
 //  - powerPreference:'high-performance' (A2): pick the discrete GPU on dual-GPU machines.
 (function(){
   var orig = HTMLCanvasElement.prototype.getContext;
   HTMLCanvasElement.prototype.getContext = function(type, attrs){
     if (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl'){
       attrs = attrs || {};
       attrs.alpha = false;                 // opaque canvas — desktop framebuffer semantics
       attrs.premultipliedAlpha = false;    // moot with alpha:false; explicit for clarity
       if (!window.__NO_GPU_HINT && !/[?&]noopt\b/.test(location.search)
           && attrs.powerPreference == null) attrs.powerPreference = 'high-performance';
       // desynchronized disabled — suspected first-frame hang in headless preview.
     }
     var ctx = orig.call(this, type, attrs);
     // Enable EXT_texture_filter_anisotropic on the context: WebGL2 reports it in the extension
     // string (so OSG thinks it's usable) but the GL_TEXTURE_MAX_ANISOTROPY_EXT pname is only
     // ACCEPTED after getExtension() is called on the context — otherwise glTexParameterf raises
     // GL_INVALID_ENUM. Calling it here lets the OSG anisotropy path work (see Texture.cpp).
     if (ctx && (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl')) {
       try { ctx.getExtension('EXT_texture_filter_anisotropic'); } catch (e) {}
     }
     return ctx;
   };
 })();
 const logEl = document.getElementById('log');
 let started = false;
 // HRTF binaural spatialization: emscripten's OpenAL positions sources with PannerNodes
 // left at the default 'equalpower' model. Flip every panner the engine creates to the
 // Web Audio HRTF model — proper binaural 3D audio on headphones, no engine change.
 // (?nohrtf opts out for A/B comparison or low-end CPUs.)
 (function(){
   if (/[?&]nohrtf\b/.test(location.search)) return;
   ['AudioContext','webkitAudioContext'].forEach(function(k){
     var C = window[k];
     if (!C || !C.prototype || !C.prototype.createPanner) return;
     var orig = C.prototype.createPanner;
     C.prototype.createPanner = function(){
       var p = orig.call(this);
       try { p.panningModel = 'HRTF'; } catch(e){}
       return p;
     };
   });
 })();
 // Web Audio contexts start "suspended" until a user gesture. OpenMW opens the OpenAL
 // device fine, but nothing is audible until we resume. Track every AudioContext the
 // engine creates and resume them all on the first click/keypress.
 (function(){
   const audioCtxs = [];
   ['AudioContext','webkitAudioContext'].forEach(function(k){
     const Orig = window[k];
     if (!Orig) return;
     window[k] = function(){ const c = new Orig(...arguments); audioCtxs.push(c); return c; };
     window[k].prototype = Orig.prototype;
   });
   function resumeAll(){ audioCtxs.forEach(function(c){ if(c.state==='suspended') c.resume(); }); }
   ['pointerdown','keydown','touchstart','click'].forEach(function(ev){
     window.addEventListener(ev, resumeAll, {capture:true});
   });
 })();
 const hudEl = document.getElementById('hud');
 let lastMsg = 'booting…';
 function append(t, cls){ if(!started){logEl.textContent='';started=true;}
   const s=document.createElement('span'); if(cls)s.className=cls; s.textContent=t+"\n"; logEl.appendChild(s);
   logEl.scrollTop=logEl.scrollHeight;
   lastMsg = String(t).slice(0, 90);
   // keep the DOM log from growing unbounded
   while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild); }
 // Full-screen fatal overlay: aborts, GPU context loss, unsupported browsers. The hidden dev
 // log is useless to end users — anything fatal must be VISIBLE with a way forward.
 function fatalOverlay(title, detail, showReload){
   try {
     var o = document.createElement('div');
     o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(8,8,12,.96);color:#cdd6f4;'
       + 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;'
       + 'font:15px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:24px';
     var h = document.createElement('div'); h.style.cssText='font-size:20px;color:#f38ba8'; h.textContent = title;
     var d = document.createElement('div'); d.style.maxWidth='640px'; d.textContent = detail || '';
     o.appendChild(h); o.appendChild(d);
     if (showReload !== false){
       var b = document.createElement('button');
       b.textContent = 'Reload';
       b.style.cssText = 'font:16px ui-monospace,Menlo,monospace;padding:8px 26px;cursor:pointer;'
         + 'background:#313244;color:#cdd6f4;border:1px solid #585b70;border-radius:6px';
       b.addEventListener('click', function(){ location.reload(); });
       o.appendChild(b);
     }
     document.body.appendChild(o);
   } catch(e){}
 }
 // Hard requirement check: this build uses pthreads (SharedArrayBuffer), which needs
 // cross-origin isolation and a capable browser. Fail with a CLEAR message, not a cryptic
 // instantiation error (Safari/iOS and non-isolated hosts land here).
 if (!self.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined'){
   fatalOverlay('Browser not supported',
     'This build needs SharedArrayBuffer + cross-origin isolation (COOP/COEP headers). '
     + 'Use a desktop Chrome/Edge/Firefox, and serve via play/server.py or an HTTPS host '
     + 'sending COOP: same-origin and COEP: require-corp.', false);
 }
 // WebGL context loss: OSG/OpenMW has no GPU-resource restore path, so the correct handling
 // tier is: sync saves, tell the user, reload cleanly (state comes back from IndexedDB).
 (function(){
   var canvas = document.getElementById('canvas');
   canvas.addEventListener('webglcontextlost', function(e){
     e.preventDefault();
     try { if (window.__omwSync) window.__omwSync(); } catch(ex){}
     append('GPU context lost', 'err');
     fatalOverlay('Graphics context lost',
       'The browser reset the GPU context (driver reset or resource pressure). '
       + 'Your saves are safe. Reloading…');
     setTimeout(function(){ location.reload(); }, 2500);
   });
   canvas.addEventListener('webglcontextrestored', function(){ append('GPU context restored'); });
 })();
 // Surface unhandled promise rejections + JS errors (previously silent) and auto-open the log
 // the FIRST time a genuine JS fault occurs — NOT on routine engine warnings (OpenMW routes
 // Debug::Warning through printErr, which would otherwise pop the log open constantly).
 var __firstFaultShown = false;
 function showLogOnce(){ if(!__firstFaultShown){ __firstFaultShown = true; logEl.classList.add('show'); } }
 window.addEventListener('unhandledrejection', function(e){
   append('unhandled rejection: ' + (e.reason && e.reason.message || e.reason), 'err');
   showLogOnce();
 });
 // Log is hidden by default so it doesn't cover the screen. Open/close it by CLICKING the
 // status bar (top-left) or pressing ` (backtick). Clicking the status bar again closes it.
 function toggleLog(){ logEl.classList.toggle('show'); }
 hudEl.addEventListener('click', toggleLog);
 window.addEventListener('keydown', function(e){ if (e.key === '`') toggleLog(); });
 // Live status HUD + periodic console logging so you can SEE what's happening / the FPS.
 (function(){
   let lastFps = -1, tick = 0;
   setInterval(function(){
     const fps = (window.__fps|0), ms = (window.__frameMs||0);
     const running = !!(window.Module && window.Module._omw_pump_frame);
     const open = logEl.classList.contains('show');
     hudEl.textContent = '☰ ' + (running ? ('FPS '+fps+'  ('+ms+'ms/frame)') : 'loading…') + '   ' + lastMsg + (open ? '   [click to hide log]' : '   [click for log]');
     // Console: log on FPS change or every ~4s so devtools shows a live heartbeat.
     tick++;
     if (running && (fps !== lastFps || tick % 8 === 0)){
       console.log('[status] fps='+fps+' frameMs='+ms+' | '+lastMsg);
       lastFps = fps;
     }
   }, 500);
 })();

 // --- Windowless full-viewport rendering: keep the canvas DRAWING BUFFER matched to the
 // browser window so OpenMW renders at exactly the window resolution and fills it. OpenMW's
 // SDL2 window is SDL_WINDOW_RESIZABLE and fires SDL_WINDOWEVENT_SIZE_CHANGED -> windowResized()
 // (resizes viewport + FBOs + GUI) whenever the canvas size changes, so we just drive the size. ---
 (function(){
   var canvas = document.getElementById('canvas');
   // Compute a capped RENDER resolution from the window + a pixel budget, ONCE. OpenMW creates
   // its SDL window at [Video] resolution x/y (written from these in preRun), so the canvas
   // drawing buffer matches what SDL expects — NO JS<->SDL resize war (that war recreated the
   // FBOs repeatedly and froze the engine). CSS (#canvas is 100vw/100vh) scales the capped
   // render up to fill the window. Perf lever: window.__maxPixels (set before load).
   var w = window.innerWidth || 1280, h = window.innerHeight || 720;
   // 4MP default covers up to ~2560x1440 natively (no blurry CSS upscale, GUI sized correctly).
   // The engine now has the headroom for it (wasm-EH + SIMD landed ~4.4ms/frame at 1.2MP).
   // Still overridable via window.__maxPixels for slower machines.
   var budget = window.__maxPixels || 4000000;
   var scale = Math.min(1, Math.sqrt(budget / (w * h)));
   window.__renderW = Math.max(320, Math.round(w * scale));
   window.__renderH = Math.max(240, Math.round(h * scale));
   // Set the drawing buffer once so it's correct even before SDL_CreateWindow; matches the
   // resolution we write to settings.cfg, so nothing ever fights over it afterward.
   canvas.width = window.__renderW; canvas.height = window.__renderH;
   // NOTE: no double-click->fullscreen handler — a double-click is a normal in-game action
   // (e.g. attack), and hijacking it to toggle fullscreen is hostile. Fullscreen is available
   // via the browser's own control / F11.
   canvas.addEventListener('pointerdown', function(){ canvas.focus(); });
   window.addEventListener('load', function(){ canvas.focus(); });

   // --- Live browser-window resize (debounced). The old naive per-interval resize caused an
   // FBO-recreation storm; a single application ~300ms after the LAST resize event is safe.
   // Applies through the engine (omw_set_resolution -> SDL_SetWindowSize -> windowResized),
   // which resizes viewport/FBOs/GUI exactly like a desktop window resize. ---
   var resizeTimer = null;
   window.addEventListener('resize', function(){
     if (resizeTimer) clearTimeout(resizeTimer);
     resizeTimer = setTimeout(function(){
       resizeTimer = null;
       if (!(window.Module && Module._omw_set_resolution)) return; // engine not up yet
       var w = window.innerWidth || 1280, h = window.innerHeight || 720;
       var budget = window.__maxPixels || 4000000;
       var scale = Math.min(1, Math.sqrt(budget / (w * h)));
       // New NATIVE (100%) render size for the resized window.
       var nw = Math.max(320, Math.round(w * scale)), nh = Math.max(240, Math.round(h * scale));
       // Preserve the player's chosen SCALE TIER across the resize: infer the integer divisor
       // (1=native, 2=50%, 3=33% …) from the current drawing buffer vs. the PREVIOUS native
       // (window.__renderW). The Options list only offers native/div tiers, so this is exact.
       var prevNativeW = window.__renderW || nw;
       var div = Math.max(1, Math.round(prevNativeW / Math.max(1, canvas.width)));
       // New buffer = new native / div (native kept exact; downscales evened for FBO/codec sanity).
       var rw = div === 1 ? nw : (Math.round(nw / div) & ~1);
       var rh = div === 1 ? nh : (Math.round(nh / div) & ~1);
       rw = Math.max(320, rw); rh = Math.max(240, rh);
       // Update the native baseline so the Options list (built from __renderW/H) reflects the
       // resized window on its next open, and the divisor stays inferable on the next resize.
       window.__renderW = nw; window.__renderH = nh;
       if (rw === canvas.width && rh === canvas.height) return; // window unchanged -> nothing to do
       append('[resize] ' + rw + 'x' + rh + ' (1/' + div + ' of ' + nw + 'x' + nh + ')');
       try { Module._omw_set_resolution(rw, rh); } catch(e){ append('[resize err] '+e,'err'); }
     }, 300);
   });

   // --- Keyboard capture guards (capture phase, before SDL sees them):
   //  - Tab must stay in-game (GUI navigation), not move browser focus.
   //  - Ctrl/Cmd+S is the browser save-page dialog — swallow it (in-game quicksave is F5-free).
   //  - F5/Ctrl+R reload the page mid-game — block with a hint (use the menu to quit).
   //  - Ctrl/Cmd+W cannot be blocked by content JS; the dynamic beforeunload guard (below)
   //    intercepts the actual tab close instead.
   window.addEventListener('keydown', function(e){
     var mod = e.ctrlKey || e.metaKey;
     if (e.key === 'Tab'){ e.preventDefault(); return; }
     if (mod && (e.key === 's' || e.key === 'S')){ e.preventDefault(); return; }
     if (e.key === 'F5' || (mod && (e.key === 'r' || e.key === 'R'))){
       e.preventDefault();
       append('[guard] page reload blocked — use the in-game menu to exit (or close the tab)');
       return;
     }
     // Focus resilience: typing while the canvas lost focus -> refocus so input reaches the game.
     if (document.activeElement !== canvas && !e.metaKey && !e.ctrlKey && !e.altKey) canvas.focus();
   }, {capture:true});
   canvas.addEventListener('blur', function(){ append('[focus] canvas lost focus — click to resume'); });

   // --- OS clipboard -> game (paste): browser paste events carry the real OS clipboard; push
   // the text into SDL's internal clipboard so the in-game Ctrl+V that follows reads it.
   // (Known race: the SDL Ctrl+V keydown can beat this event — a second Ctrl+V is correct.)
   document.addEventListener('paste', function(e){
     try {
       var t = e.clipboardData && e.clipboardData.getData('text/plain');
       if (t && window.Module && Module.stringToNewUTF8 && Module._omw_set_clipboard){
         var p = Module.stringToNewUTF8(t);
         Module._omw_set_clipboard(p);
         Module._free(p);
       }
     } catch(ex){}
   });

   // --- Pointer-lock helper: cursor warping is impossible in browsers — pointer lock is the
   // only correct relative-mouse model. If the engine wants relative mode but the lock was
   // refused (request arrived before a user gesture), re-request it on the next click.
   canvas.addEventListener('pointerdown', function(){
     try {
       if (window.Module && Module.__omwWantsMouseLock && document.pointerLockElement !== canvas) {
         // requestPointerLock() returns a promise in modern Chrome; it REJECTS if called too soon
         // after the user exited the lock (browser rate-limit) — swallow that so it doesn't surface
         // as an "unhandled rejection" in the console. The next click re-requests successfully.
         const p = canvas.requestPointerLock();
         if (p && typeof p.catch === 'function') p.catch(function(){});
       }
     } catch(e){}
   });
 })();

 // --- Quit hook (engine calls window.__omwOnQuit after syncing saves): a cancelled main loop
 // in a frozen tab is hostile UX — show a clear end state instead.
 window.__omwOnQuit = function(){
   append('[quit] engine exited');
   fatalOverlay('Morrowind has exited', 'Your saves are stored in this browser. Reload to play again.');
 };

 // --- Page lifecycle (bfcache-safe): visibilitychange->hidden is the LAST RELIABLE signal
 // (esp. iOS Safari, which never fires beforeunload); pagehide covers navigation. A static
 // beforeunload handler would make the page bfcache-ineligible, so the unsaved-progress guard
 // is registered ONLY while a game is running (engine flips Module.__omwRunning).
 document.addEventListener('visibilitychange', function(){
   if (document.visibilityState === 'hidden' && window.__omwSync) window.__omwSync();
 });
 window.addEventListener('pagehide', function(){ if (window.__omwSync) window.__omwSync(); });
 (function(){
   var guard = function(e){ e.preventDefault(); e.returnValue = ''; return ''; };
   var armed = false;
   setInterval(function(){
     var running = !!(window.Module && Module.__omwRunning);
     if (running && !armed){ window.addEventListener('beforeunload', guard); armed = true; }
     else if (!running && armed){ window.removeEventListener('beforeunload', guard); armed = false; }
   }, 2000);
 })();
 var Module = {
   canvas: document.getElementById('canvas'),
   // ?start=<cell> deep-links straight into a cell as a fresh default character (skip-menu +
   // new-game bypass chargen). Dev/QA aid — only active when the param is present; normal boots
   // keep the full menu -> intro -> chargen flow (1:1). Set here (not preRun) because emscripten
   // captures Module.arguments before preRun callbacks fire.
   arguments: (function(){
     try {
       var m = /[?&]start=([^&]+)/.exec(location.search);
       if (m) return ['--skip-menu', '--new-game', '--start', decodeURIComponent(m[1])];
     } catch (e) {}
     return [];
   })(),
   preRun: [function(){
     try {
       ENV.HOME='/home/web_user'; ENV.USER='player'; ENV.LOGNAME='player';
       // ?nomw boots the free example-suite: enable its compat shims (chargen auto-confirm,
       // +10h daytime start). NEVER set for retail Morrowind — the engine stays 1:1 stock.
       if (window.__FORCE_NOMW || /[?&]nomw\b/.test(location.search)) ENV.OPENMW_EXAMPLE_SUITE='1';
       // ?start=<cell> (deep-link) => auto-complete chargen so the new game drops straight into
       // the target cell (see Module.arguments above + charactercreation.cpp). QA aid only.
       if (/[?&]start=/.test(location.search)) ENV.OPENMW_QA_AUTOCHARGEN='1';
       // ?forcemrt (QA) reproduces the pre-fix pass-normals-MRT indexed-blend bug (opaque-black
       // smoke) for A/B comparison. Never used in normal play.
       if (/[?&]forcemrt\b/.test(location.search)) ENV.OMW_FORCE_NORMALS_RT='1';
       // ?debug -> verbose OSG logs (shows which subsystem is active when boot stalls)
       if (/[?&]debug\b/.test(location.search)) ENV.OSG_NOTIFY_LEVEL='INFO';
       // Engine log level: Info by default (the per-tile navmesh Debug logs flood the console
       // and the HUD status line); ?debuglog restores full Verbose logging.
       // NOTE: toLevel() in debugging.cpp only matches UPPERCASE names; 'Info' silently fell
       // through to the Verbose default, leaking Verbose spam. Use the exact uppercase tokens.
       ENV.OPENMW_DEBUG_LEVEL = /[?&]debuglog\b/.test(location.search) ? 'VERBOSE' : 'INFO';
       ENV.ICU_DATA='/'; // directory holding icudt68l.dat (real ICU locale data)
       // (OPENMW_DONT_PRECOMPILE no longer set: the SingleThreaded viewer runs the
       //  incremental GL precompile on the main GL thread — smooths cell transitions.)
       // A1: disable OSG's per-frame glGetError() check. Default is ONCE_PER_FRAME, and glGetError
       // is a hard GPU sync (flush+wait) in WebGL — a per-frame stall. OFF => NEVER_CHECK_GL_ERRORS.
       // Also stops the residual "invalid enumerant after RenderBin::draw" warning at its checkpoint.
       if (!/[?&]noopt\b/.test(location.search)) ENV.OSG_GL_ERROR_CHECKING='OFF';
       // NOTE: OPENMW_DECOMPRESS_TEXTURES removed — OSG now reports S3TC support (GLExtensions
       // patch), so DXT textures upload COMPRESSED via glCompressedTexImage2D (no CPU decompress).
       // USER CONFIG/DATA LIVE ON IDBFS: pointing XDG at the /userdata mount makes the
       // engine's own writes persistent — Options-menu settings.cfg, keybindings
       // (input_v3.xml), Lua mod storage (global/player_storage.bin), console history and
       // screenshots all survive reloads with zero engine changes. (Cache stays in MEMFS.)
       ENV.XDG_CONFIG_HOME='/userdata/config';
       ENV.XDG_DATA_HOME='/userdata/data-home';
       ENV.XDG_CACHE_HOME='/home/web_user/.cache';
       FS.mkdirTree('/home/web_user/.cache/openmw');
       // Performance-tuned settings (merged over defaults). Biggest levers for the WASM build:
       //  - viewing distance: fewer cells/objects culled+drawn (default 7168)
       //  - water reflection detail 0 + small rtt: water no longer re-renders the whole scene
       //  - larger small-feature-culling: skip tiny distant objects
       // All tunable; raise for fidelity, lower for FPS.
       try {
         // OpenMW creates its SDL window at this resolution -> matches the canvas drawing buffer
         // set in the head IIFE, so JS and SDL agree on the size (no resize war / FBO thrash).
         var rW = (typeof window!=='undefined' && window.__renderW) || 1280;
         var rH = (typeof window!=='undefined' && window.__renderH) || 720;
         // IMPORTANT: OpenMW loads user settings from <last active config dir>/settings.cfg.
         // In this build the only config dir is '/' (where openmw.cfg lives), NOT the XDG
         // path — write the file to BOTH so the engine actually reads it.
         var settingsCfg =
           '[Video]\n' +
           'resolution x = ' + rW + '\n' +
           'resolution y = ' + rH + '\n' +
           'window mode = 2\n' +                   // 2 = windowed (canvas); CSS scales it to fill
           // ?aa=N (QA) sets [Video] antialiasing so scene MSAA can be exercised headlessly
           // (default off = 1:1 with desktop). Normal play leaves AA to the Options menu.
           (/[?&]aa=(\d+)/.test(location.search) ? 'antialiasing = ' + RegExp.$1 + '\n' : '') +
           '[Camera]\n' +
           'viewing distance = 8192.0\n' +        // reach the valley mountain-backdrop ring (~4000u)
           'small feature culling pixel size = 3.0\n' +
           '[Terrain]\n' +
           'object paging = true\n' +
           'object paging active grid = true\n' +
           'object paging min size = 0.005\n' +   // render/merge the distant backdrop rocks + trees
           '[Water]\n' +
           'shader = true\n' +                     // real water shader (reflections/refractions)
           'reflection detail = 2\n' +             // 2 = reflect statics+terrain (0 disabled it)
           'refraction = true\n' +
           'rtt size = 512\n' +
           'small feature culling pixel size = 30.0\n' +
           '[Shadows]\n' +
           'enable shadows = true\n' +             // WebGL2 depth-texture shadow maps
           'shadow map resolution = 2048\n' +      // finer texels -> less shadow swim on camera turn
           'actor shadows = true\n' +
           'player shadows = true\n' +
           'object shadows = false\n' +            // biggest perf cost; leave off by default
           'terrain shadows = true\n' +
           'maximum shadow map distance = 4096\n' +
           '[Cells]\n' +
           'preload cell cache max = 18\n' +   // engine asked for 18 for exterior preloading
           '[Game]\n' +
           'actors processing range = 4096\n' +   // AI-process fewer distant NPCs/creatures (towns)
           '[Shaders]\n' +
           'max lights = 8\n' +                    // fewer dynamic lights per object -> faster shading
           // Light particle systems with nearby point lights. Without this, particles get only
           // ambient+emission, so interior smoke/fire (lit solely by the hearth/torch point
           // light) renders as a black quad. Cheap at max lights=8.
           'particle point lighting = true\n';
         // Baseline DEFAULTS layer only. The engine reads this ('/' is an earlier active
         // config dir) as additional defaults and layers the PERSISTENT user settings from
         // /userdata/config/openmw/settings.cfg (IDBFS) on top — so Options-menu changes,
         // including a chosen resolution, override these and survive reloads. NEVER write
         // the baseline to the user path (it would clobber the player's saved options).
         FS.writeFile('/settings.cfg', settingsCfg);
         append('[cfg] render resolution ' + rW + 'x' + rH);
       } catch(e){ append('[settings err] '+e,'err'); }
       FS.mkdirTree('/userdata');
       // Ask the browser for durable storage: without persist(), IndexedDB (saves, settings)
       // and the Cache API archive are LRU-evictable under storage pressure.
       try {
         if (navigator.storage && navigator.storage.persist)
           navigator.storage.persist().then(function(granted){
             append('[storage] persistent storage ' + (granted ? 'GRANTED' : 'not granted (evictable)'));
           });
         if (navigator.storage && navigator.storage.estimate)
           navigator.storage.estimate().then(function(est){
             var q = Math.round((est.quota||0)/1048576), u = Math.round((est.usage||0)/1048576);
             append('[storage] quota ' + q + 'MB, used ' + u + 'MB');
             if (est.quota && est.quota < 1200*1048576)
               append('[storage] WARNING: quota below ~1.2GB — the data cache may not fit; ' +
                      'first load will work but re-downloads on each visit', 'err');
           });
       } catch(e){}
       // Persist saves/config across reloads: mount IndexedDB-backed IDBFS at /userdata
       // and load its contents before the engine starts (via a run dependency so boot waits).
       try {
         var IDBFS = FS.filesystems.IDBFS;
         if (IDBFS) {
           FS.mount(IDBFS, {}, '/userdata');
           addRunDependency('idbfs-load');
           FS.syncfs(true, function(err){
             if (err) append('[idbfs load err] '+err,'err'); else append('[idbfs] loaded persistent /userdata');
             try {
               // Dirs must be created AFTER the mount+load (before = hidden by the mount).
               FS.mkdirTree('/userdata/data');            // openmw.cfg data-local
               FS.mkdirTree('/userdata/config/openmw');   // XDG user config (persistent)
               FS.mkdirTree('/userdata/data-home/openmw'); // XDG user data: saves/screenshots
               // Marker openmw.cfg: makes the user config dir an ACTIVE config path, so the
               // engine both READS user settings from and SAVES them to this IDBFS dir
               // (settings.cpp uses the last active config dir for the user settings file).
               if (!FS.analyzePath('/userdata/config/openmw/openmw.cfg').exists)
                 FS.writeFile('/userdata/config/openmw/openmw.cfg',
                   '# OpenMW user config dir (persistent, IndexedDB-backed)\n');
               FS.syncfs(false, function(){});
             } catch(e){ append('[idbfs setup err] '+e,'err'); }
             removeRunDependency('idbfs-load');
           });
           // Flush game state back to IndexedDB periodically (lifecycle handlers cover exits).
           window.__omwSync = function(){ try { FS.syncfs(false, function(){}); } catch(e){} };
           setInterval(window.__omwSync, 15000);
         } else {
           append('[idbfs] not available — saves will NOT persist across reloads','err');
         }
       } catch(e){ append('[idbfs mount err] '+e,'err'); }

       // --- Load REAL Morrowind data at runtime (esm + bsa + loose audio tar) ---
       // Fetched SEQUENTIALLY (not Promise.all) so peak JS-heap stays low, into MEMFS under
       // /mwdata, then the preloaded openmw.cfg is rewritten to load Morrowind. Boot waits.
       try {
         // Diagnostic: ?nomw skips the 817MB Morrowind load and boots the tiny preloaded
         // example-suite instead — lets a light load verify the render path (S3TC/SIMD/resize).
         if (window.__FORCE_NOMW || /[?&]nomw\b/.test(location.search)){
           // The example-suite demo (village of NPCs, guards, monsters, hi-def CC0 textures
           // + curated MW dressing) is BAKED into the preloaded /gamedata package + openmw.cfg
           // by content/suite-enhance/*, so nothing extra is fetched at runtime.
           append('[mw] SKIPPED (nomw) — booting example-suite demo');
           throw {__skip:1};
         }
         FS.mkdirTree('/mwdata');
         addRunDependency('mw-data');
         // Minimal ustar extractor: writes each entry under destPrefix into MEMFS.
         function untar(buf, destPrefix){
           var u8 = new Uint8Array(buf), off = 0, n = 0;
           function str(o,len){ var s=''; for(var i=0;i<len;i++){ var c=u8[o+i]; if(c===0) break; s+=String.fromCharCode(c);} return s; }
           while (off + 512 <= u8.length){
             var name = str(off,100);
             if (name === ''){ off += 512; continue; } // zero/pad block
             var prefix = str(off+345,155);
             var full = prefix ? prefix + '/' + name : name;
             var size = parseInt(str(off+124,12).trim(),8) || 0;
             var type = u8[off+156];
             off += 512;
             // Skip macOS AppleDouble junk (._name) + __MACOSX so OpenMW doesn't try to load them.
             var base = full.substring(full.lastIndexOf('/') + 1);
             if (base.indexOf('._') === 0 || full.indexOf('__MACOSX') !== -1){ off += Math.ceil(size/512)*512; continue; }
             var path = destPrefix + full;
             if (type === 53){ try { FS.mkdirTree(path); } catch(e){} }        // '5' dir
             else if (type === 48 || type === 0){                              // '0'/'\0' file
               var dir = path.substring(0, path.lastIndexOf('/'));
               try { FS.mkdirTree(dir); } catch(e){}
               try { FS.writeFile(path, u8.subarray(off, off+size)); n++; } catch(e){}
             }
             off += Math.ceil(size/512) * 512;
           }
           return n;
         }
         // Cache-API-backed fetch with REAL progress: streams the body so the HUD can show
         // per-file % and cumulative MB (previously a multi-minute blank wait). Downloads once,
         // then persists across reloads (cache.put ignores the dev server's no-cache headers).
         // QuotaExceeded on cache.put is non-fatal: skip caching, keep playing.
         var __dlTotal = 0; // cumulative bytes this session (for the HUD)
         function fetchStreaming(url){
           return fetch(url).then(function(r){
             if(!r.ok) throw url+' HTTP '+r.status;
             var name = url.split('/').pop();
             var total = parseInt(r.headers.get('Content-Length')||'0',10);
             if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function(ab){ return {resp:r, buf:ab}; });
             var reader = r.body.getReader(), chunks = [], got = 0, lastPct = -10;
             function pump(){
               return reader.read().then(function(res){
                 if (res.done){
                   var out = new Uint8Array(got), pos = 0;
                   for (var i=0;i<chunks.length;i++){ out.set(chunks[i], pos); pos += chunks[i].length; }
                   __dlTotal += got;
                   return {resp:r, buf:out.buffer};
                 }
                 chunks.push(res.value); got += res.value.length;
                 var pct = total ? Math.floor(got*100/total) : 0;
                 if (pct >= lastPct + 5){ // update every 5% to keep the log readable
                   lastPct = pct;
                   append('[dl] ' + name + ' ' + (total ? pct+'%' : Math.round(got/1048576)+'MB')
                     + '  (session total ' + Math.round((__dlTotal+got)/1048576) + 'MB)');
                 }
                 return pump();
               });
             }
             return pump();
           });
         }
         function grab(url){
           if (!self.caches) return fetchStreaming(url).then(function(x){ return x.buf; });
           return caches.open('mwdata-v1').then(function(cache){
             return cache.match(url).then(function(hit){
               if (hit){ append('[mw] cache hit '+url); return hit.arrayBuffer(); }
               return fetchStreaming(url).then(function(x){
                 return cache.put(url, new Response(x.buf)).then(
                   function(){ return x.buf; },
                   function(e){
                     append('[cache] put failed (' + (e && e.name) + ') — continuing uncached', 'err');
                     return x.buf;
                   });
               });
             });
           });
         }
         function writeRaw(dest){ return function(b){ FS.writeFile(dest, new Uint8Array(b)); return b.byteLength; }; }
         function untarInto(label){ return function(b){ var c = untar(b, '/mwdata/'); append('[mw] '+label+': extracted '+c+' files'); }; }
         // ?stream: don't copy the BSAs into memory at all — mount them as lazy range-read
         // files (emscripten FS.createLazyFile + the server's HTTP Range support). Only the
         // bytes OpenMW actually touches are fetched/resident: cuts resident memory by the
         // ~483MB of archives and removes them from the up-front download entirely.
         var STREAM_BSA = /[?&]stream\b/.test(location.search);
         if (STREAM_BSA){ try { StreamFS.init(); } catch(e){ append('[mw] streamfs unavailable: '+e, 'err'); STREAM_BSA = false; } }
         function addBsa(name){
           if (STREAM_BSA){
             // Probe the size with a 1-byte range request, then mount the worker-backed
             // streaming file (see streamfs.js). No archive bytes resident up-front.
             return fetch('mwdata/' + name, { headers: { Range: 'bytes=0-0' } }).then(function(r){
               var cr = r.headers.get('Content-Range');
               var size = cr ? parseInt(cr.split('/')[1], 10) : NaN;
               if (!size) throw 'no Content-Range for ' + name;
               StreamFS.mount('/mwdata/' + name, 'mwdata/' + name, size);
               append('[mw] ' + name + ' mounted streaming (' + Math.round(size/1048576) + 'MB on demand)');
             }).catch(function(e){
               append('[mw] stream mount failed for ' + name + ', falling back: ' + e, 'err');
               return grab('mwdata/' + name).then(writeRaw('/mwdata/' + name));
             });
           }
           return grab('mwdata/' + name).then(writeRaw('/mwdata/' + name));
         }
         append('[mw] loading Morrowind (cached after first run)…');
         grab('mwdata/Morrowind.esm').then(writeRaw('/mwdata/Morrowind.esm'))
         .then(function(){ append('[mw] esm ok; bsa (310MB)…'); return addBsa('Morrowind.bsa'); })
         .then(function(){ append('[mw] bsa ok; sound+music (81MB)…'); return grab('mwdata/mwaudio.tar').then(untarInto('audio')); })
         .then(function(){ append('[mw] voice (111MB)…'); return grab('mwdata/mwvoice.tar').then(untarInto('voice')); })
         .then(function(){ append('[mw] splash+fonts (33MB)…'); return grab('mwdata/mwextra.tar').then(untarInto('extra')); })
         .then(function(){ append('[mw] Tribunal (65MB)…'); return grab('mwdata/Tribunal.esm').then(writeRaw('/mwdata/Tribunal.esm')); })
         .then(function(){ return addBsa('Tribunal.bsa'); })
         .then(function(){ append('[mw] Bloodmoon (121MB)…'); return grab('mwdata/Bloodmoon.esm').then(writeRaw('/mwdata/Bloodmoon.esm')); })
         .then(function(){ return addBsa('Bloodmoon.bsa'); })
         .then(function(){ append('[mw] Bloodmoon sounds (28MB)…'); return grab('mwdata/mwbmsound.tar').then(untarInto('bm-sound')); })
         .then(function(){
           // Videos ON BY DEFAULT (?novid to opt out). Playback is cooperative under
           // emscripten (WindowManager::playVideo starts the decode pthreads and returns;
           // Engine::frame drives updateVideoPlayback each tick) — the old blocking-loop
           // futex deadlock is fixed. The original .bik files play in-engine via the native
           // Bink decoder (FFmpeg --enable-decoder=bink); nothing is transcoded.
           if (/[?&]novid\b/.test(location.search)){ append('[mw] videos skipped (?novid)'); window.__noMovies = true; return; }
           append('[mw] videos (40MB, played on the fly)…'); return grab('mwdata/mwvideo.tar').then(untarInto('video'));
         })
         .then(function(){
           // Rewrite openmw.cfg once the preloaded copy is present in MEMFS. Full GOTY load order,
           // and replace the OpenMW example-suite movie names with Morrowind's real .bik files
           // (OpenMW decodes Bink natively — no conversion, the originals play as-is).
           (function waitCfg(){
             if (FS.analyzePath('/openmw.cfg').exists){
               var cfg = FS.readFile('/openmw.cfg', {encoding:'utf8'}).split('\n').filter(function(l){
                 return !/^content=/.test(l) && !/^data=\/gamedata\s*$/.test(l) && !/^fallback-archive=/.test(l)
                     && !/^fallback=Movies_/.test(l);
               });
               cfg.push('data=/mwdata',
                        // Make the IDBFS dir an ACTIVE config path so it becomes the engine's
                        // user-config dir (getUserConfigPath() = last active config path). The
                        // engine then READS user settings from and WRITES them to this persistent
                        // dir — Options changes, keybindings, Lua storage survive reloads. The
                        // baseline /settings.cfg (front of the chain) still applies as defaults.
                        'config="/userdata/config/openmw"',
                        'fallback-archive=Morrowind.bsa', 'fallback-archive=Tribunal.bsa', 'fallback-archive=Bloodmoon.bsa',
                        'content=Morrowind.esm', 'content=Tribunal.esm', 'content=Bloodmoon.esm');
               if (!window.__noMovies)
                 cfg.push('fallback=Movies_Company_Logo,bethesda logo.bik',
                          'fallback=Movies_Morrowind_Logo,mw_logo.bik',
                          'fallback=Movies_New_Game,mw_intro.bik');
               FS.writeFile('/openmw.cfg', cfg.join('\n'));
               append('[mw] READY -> Morrowind GOTY (base+Tribunal+Bloodmoon, audio+voice+video)');
               removeRunDependency('mw-data');
             } else { setTimeout(waitCfg, 25); }
           })();
         }).catch(function(e){ append('[mw load err] '+e,'err'); removeRunDependency('mw-data'); });
       } catch(e){ append('[mw setup err] '+e,'err'); }

       append('[preRun] env + user dirs ready');
     } catch(e){ append('[preRun error] '+e,'err'); }
   }],
   print: (t)=>{ console.log(t); append(t); },
   printErr: (t)=>{ console.warn(t); append(t,'err'); },
   onAbort: function(w){
     append('ABORT: '+w,'err');
     try { if (window.__omwSync) window.__omwSync(); } catch(e){}
     fatalOverlay('The game hit a fatal error', String(w||'') +
       (String(w).toLowerCase().indexOf('memory') >= 0
        ? ' — the browser could not grow WebAssembly memory. Close other tabs/apps and reload.'
        : ' — your saves are safe. Reloading may fix it.'));
   },
   setStatus: (t)=>{ if(t) append('[status] '+t); },
   onRuntimeInitialized: function(){
     // Drive the engine frame from a MessageChannel: unlike setTimeout/requestAnimationFrame,
     // MessageChannel messages are NOT throttled when the tab is hidden/backgrounded, so the
     // game keeps running (and stays interactive) even in the background. omw_pump_frame() is a
     // no-op until the C++ main loop registers itself; the engine's own FrameRateLimiter paces it.
     try {
       var mc = new MessageChannel();
       // FPS instrumentation: count real engine frames + per-frame wall time.
       window.__fps = 0; window.__frameMs = 0;
       var __frames = 0, __t0 = performance.now(), __accum = 0;
       // SINGLE frame driver (the engine no longer registers emscripten_set_main_loop):
       // visible tab -> next tick scheduled via requestAnimationFrame (vsync-aligned, smooth);
       // hidden tab  -> direct postMessage (unthrottled, game keeps running in background).
       var scheduled = false;
       function scheduleNext(){
         if (scheduled) return; scheduled = true;
         if (document.hidden) mc.port2.postMessage(0);
         else requestAnimationFrame(function(){ mc.port2.postMessage(0); });
       }
       mc.port1.onmessage = function(){
         scheduled = false;
         var a = performance.now();
         try { if (Module._omw_pump_frame) Module._omw_pump_frame(); } catch(e){}
         var b = performance.now();
         __frames++; __accum += (b - a);
         var dt = b - __t0;
         if (dt >= 1000){ window.__fps = Math.round(__frames*1000/dt); window.__frameMs = +(__accum/__frames).toFixed(2); __frames = 0; __accum = 0; __t0 = b; }
         scheduleNext();
       };
       // If the tab hides while an rAF-scheduled tick is frozen, take over directly.
       // (The stale rAF firing later causes at most one harmless extra tick.)
       document.addEventListener('visibilitychange', function(){
         if (document.hidden && scheduled) mc.port2.postMessage(0);
       });
       mc.port2.postMessage(0);
       append('[pump] frame pump started (rAF-paced when visible)');
     } catch(e){ append('[pump error] '+e,'err'); }
   },
 };
 window.addEventListener('error', function(e){ append('window error: '+e.message,'err'); if(e.error&&e.error.stack) append('STACK:\n'+e.error.stack,'err'); showLogOnce(); });
</script>
<script src="streamfs.js"></script>
<script src="openmw.js"></script>
</body></html>
