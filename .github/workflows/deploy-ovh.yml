name: deploy-ovh (morrowind.virtastic.app)

# Deploys the OpenMW-WASM game to the OVH VPS via the self-hosted runner in the Virtastic org.
# The runner executes ON the VPS with docker access, so steps use docker/docker compose directly.
on:
  push:
    branches: [ovhcloud]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-morrowind
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      # Fast incremental build FROM the prebaked openmw-builder image (see Dockerfile.builder).
      - name: Build image
        run: docker build -t morrowind:ovh -f Dockerfile .

      # Sync the deploy dir (compose file) + demo dataset placeholder to /opt/morrowind.
      - name: Sync compose to /opt/morrowind
        run: |
          sudo mkdir -p /opt/morrowind/data
          sudo cp docker-compose.prod.yml /opt/morrowind/docker-compose.prod.yml

      # Drop the edge vhost into the SHARED Caddy's sites-extra (mounted read-only into nl-caddy).
      - name: Install edge vhost
        run: sudo cp deploy/morrowind.caddy /opt/nostalgia/caddy/sites-extra/morrowind.caddy

      - name: Start / update container
        run: docker compose -f /opt/morrowind/docker-compose.prod.yml up -d

      # Validate + hot-reload the shared edge (no downtime for other sites).
      - name: Reload shared Caddy
        run: |
          docker exec nl-caddy caddy validate --config /etc/caddy/Caddyfile
          docker exec nl-caddy caddy reload   --config /etc/caddy/Caddyfile

      # Health check on the nostalgia network: 200 + cross-origin-isolation header present.
      - name: Health check
        run: |
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS -D - -o /dev/null http://morrowind:8080/ \
            | tee /dev/stderr | grep -qi '^cross-origin-opener-policy: same-origin'
